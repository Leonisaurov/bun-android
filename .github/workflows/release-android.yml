name: release-android
run-name: "publicar ${{ inputs.tag }}"

# Publication lane: takes the artifact of a PREVIOUS successful
# build-android (mode=android) run, validates it, and opens a GitHub
# Release. Publishing is only ever done through workflow_dispatch
# (AGENTS rule); no push event can create a release.

"on":
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID de un run exitoso de build-android (mode=android)"
        type: string
        required: true
      tag:
        description: "Tag de la release, p. ej. v1.4.2-android.1"
        type: string
        required: true
      evidence_ref:
        description: "Referencia de la evidencia en dispositivo, p. ej. PROGRESS.md#A1 (run 37652505142, sha 899866c5)"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: bun-android-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
      EVIDENCE_REF: ${{ inputs.evidence_ref }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          # Strict allow-lists: inputs are never interpolated into commands
          # beyond these checks; everything else goes through env + jq.
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id debe ser numerico" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-android\.[0-9]+$ ]] || {
            echo "tag debe matchear ^vX.Y.Z-android.N$" >&2; exit 1; }
          # Free text, but only ever used as a single markdown line through env.
          [[ -n "$EVIDENCE_REF" && ${#EVIDENCE_REF} -le 200 ]] || {
            echo "evidence_ref debe tener 1..200 caracteres" >&2; exit 1; }
          [[ "$EVIDENCE_REF" != *$'\n'* ]] || {
            echo "evidence_ref debe ser de una sola linea" >&2; exit 1; }

      - name: Validate source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # `.name` en la API de runs es el RUN-NAME ("bun-android android"), no el
          # nombre del workflow, asi que exigir "build-android completed success"
          # nunca matchea nuestros propios runs. El vinculo estable es el id del
          # archivo .github/workflows/build-android.yml.
          ba_wfid=$(gh api "repos/$repo/actions/workflows" \
            --jq '.workflows[] | select(.path == ".github/workflows/build-android.yml") | .id')
          [ -n "$ba_wfid" ] || { echo "no existe build-android.yml en este repo" >&2; exit 1; }
          IFS=' ' read -r status concl wfid head_branch < <(
            gh api "repos/$repo/actions/runs/$RUN_ID" \
              --jq '[.status, .conclusion, (.workflow_id|tostring), .head_branch] | join(" ")')
          echo "run $RUN_ID: status=$status conclusion=$concl workflow_id=$wfid branch=$head_branch"
          { [ "$status" = "completed" ] && [ "$concl" = "success" ] && [ "$wfid" = "$ba_wfid" ]; } || {
            echo "el run indicado no es un build-android completado con exito (esperado workflow_id=$ba_wfid)" >&2; exit 1; }
          [ "$head_branch" = "main" ] || {
            echo "el run indicado no es de main ($head_branch)" >&2; exit 1; }

      - name: Download and validate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/release"
          rm -rf "$WORK"; mkdir -p "$WORK/art"
          gh run download "$RUN_ID" -n bun-aarch64-android -D "$WORK/art"
          # Single-file artifact (the linked android bun; see build-android.sh)
          [ "$(find "$WORK/art" -type f | wc -l)" -eq 1 ] || {
            echo "esperaba exactamente 1 archivo en el artefacto" >&2; exit 1; }
          BIN=$(find "$WORK/art" -type f | head -n1)
          readelf -h "$BIN" | grep -Eq 'Class: +ELF64'
          readelf -h "$BIN" | grep -Eq 'Machine: +AArch64'
          readelf -h "$BIN" | grep -Eq 'Type: +DYN'
          # The NDK linker emits `OS/ABI: UNIX - System V` for android targets
          # (e_flags carries no Android marker here), so asserting `UNIX Android`
          # could never match our own artifact. The real bionic gate is the
          # DT_NEEDED libc.so below plus the on-device run (docs/VERIFY.md).
          readelf -h "$BIN" | grep -Eq 'OS/ABI: +UNIX - (System V|GNU|Android)'
          readelf -d "$BIN" | grep -Eq 'libc\.so'
          sha256sum "$BIN" | tee "$WORK/bun-aarch64-android.sha256"
          cp "$BIN" "$WORK/bun-aarch64-android"

      - name: Package tarball
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/release"
          STAGE="$WORK/bun-linux-aarch64-android"
          mkdir -p "$STAGE"
          mv "$WORK/bun-aarch64-android" "$STAGE/bun"
          ( cd "$WORK" && tar -czf "$WORK/bun-linux-aarch64-android.tar.gz" bun-linux-aarch64-android )
          sha256sum "$WORK/bun-linux-aarch64-android.tar.gz" \
            | sed "s|$WORK/||" > "$WORK/bun-linux-aarch64-android.tar.gz.sha256"
          cat "$WORK"/*.sha256

      - name: Collect release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/release"
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          pin=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha" --jq '.commit.message' | head -1)
          # Rango de parches LEIDO DEL TREE DEL RUN publicable (no hardcodeado:
          # "0001..0006" describio mal la release cuando ya existian 0007/0008).
          patches=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$head_sha?recursive=1" \
            --jq '[.tree[]? | select(.path | test("^patches/android/[0-9]{4}-.+\\.patch$")) | .path[16:20]] | sort | .[]')
          n=$(echo "$patches" | wc -l | tr -d ' ')
          first=$(echo "$patches" | head -1); last=$(echo "$patches" | tail -1)
          [ -n "$first" ] || { echo "no encontre parches en patches/android/ del run" >&2; exit 1; }
          {
            echo " Bun $TAG para Android/Termux (aarch64, API 28), construido desde fuente."
            echo ""
            echo "- Build original: run [$RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID) (commit \`$head_sha\`; $pin)"
            echo "- Upstream pineado: oven-sh/bun \`bun-v1.4.2\`"
            echo "- Parches del port: \`patches/android/$first..$last\` ($n en total; ver docs/PATCHES.md)"
            echo "- Verificacion estatica en este job: ELF64/AArch64/ET_DYN + DT_NEEDED libc.so."
            echo "- Evidencia en dispositivo: $EVIDENCE_REF"
            echo "- Protocolo de verificacion: docs/VERIFY.md (un \"compila\" nunca cierra un hito)."
            echo ""
            echo "Instalar: descomprimir y usar \`bun-linux-aarch64-android/bun\` (en Termux, p. ej. \`~/.bun-android/bin\`)."
          } > "$WORK/body.md"
          cp "$WORK/bun-aarch64-android.sha256" "$WORK/bun-aarch64-android.sha256.txt"
          cp "$WORK/bun-linux-aarch64-android.tar.gz.sha256" "$WORK/bun-linux-aarch64-android.tar.gz.sha256.txt"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/release"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "la release $TAG ya existe; no se sobreescribe" >&2; exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bun $TAG (android aarch64)" \
            --notes-file "$WORK/body.md" \
            "$WORK/bun-linux-aarch64-android.tar.gz" \
            "$WORK/bun-linux-aarch64-android.tar.gz.sha256.txt" \
            "$WORK/bun-aarch64-android" \
            "$WORK/bun-aarch64-android.sha256.txt"
